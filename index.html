<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1430">
  <meta name="description" content="Room Rush: a fast arcade dungeon run. Clear 20 rooms, pick perks, beat the boss.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Room Rush">
  <title>Room Rush</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <button class="round pause-btn" data-a="pause" aria-label="Pause"><span></span><span></span></button>
        <div class="hud-mid">
          <div class="hud-world"></div>
          <div class="hud-rooms"></div>
        </div>
        <div class="pill"><span class="amt"><i class="coin-ico"></i><span id="hudGold">0</span></span></div>
      </div>
      <div id="bossbar" class="hidden">
        <div class="bb-name"></div>
        <div class="bb-track"><div class="bb-fill"></div></div>
      </div>
    </div>
    <button id="abilityBtn" class="hidden" aria-label="Use ability"><canvas></canvas></button>
    <div id="banner"></div>
    <div id="hint"></div>
    <div id="ui"></div>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    <p>Turn your phone upright to play</p>
  </div>

  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/room.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenery.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/perks.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/affixes.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
